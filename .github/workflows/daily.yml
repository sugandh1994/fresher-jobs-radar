# Daily refresh: fetch → filter → dedupe → tag → commit data → publish site to GitHub Pages.
# Runs every day at 06:00 IST, and on demand from the Actions tab ("Run workflow").
name: Daily refresh

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST
  workflow_dispatch:

# Never run two refreshes at the same time (e.g. a manual run during the scheduled one).
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # commit site/jobs.json + data/*.json back to main
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Keep a copy of yesterday's job list
        run: cp site/jobs.json "$RUNNER_TEMP/previous_jobs.json" || true

      - name: Run the pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m pipeline.run

      - name: Show today's counts
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("data/run_log.json"))
          print("## Daily refresh\n\n| Source | Fetched | After filter | After dedupe | Error |\n|---|---|---|---|---|")
          for name, e in r["sources"].items():
              print(f"| {name} | {e.get('fetched')} | {e.get('after_filter')} | {e.get('after_dedupe')} | {e.get('error') or ''} |")
          t = r.get("tagging", {})
          print(f"\n**Final jobs:** {r['steps'].get('final')}  ·  **Tagged:** {r['steps'].get('tagged')}"
                f"  ·  **Hidden (role Other):** {r.get('out_of_scope', {}).get('hidden', 0)}"
                f"  ·  **LLM cost:** ₹{t.get('cost_inr_approx', 0)}")
          if t.get("error"):
              print(f"\n⚠️ Tagging problem: {t['error'][:300]}")
          EOF

      - name: Safety check before publishing
        run: python -m pipeline.guard "$RUNNER_TEMP/previous_jobs.json" site/jobs.json

      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/jobs.json data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Package the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
